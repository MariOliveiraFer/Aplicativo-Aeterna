<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETERNA - ADMIN</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f8f7f4;
      }
      
      .card-aeterna-admin {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      }
      .titulo-marca {
        font-family: "Playfair Display", serif;
        font-size: 2.5rem;
        font-weight: 700;
        text-align: center;
      }
      .subtitulo-marca {
        font-family: "Playfair Display", serif;
        font-size: 1.5rem;
        font-weight: 400;
        text-align: center;
      }
      .btn-btn-primary{
        width: 100%;
        height: 40px;
        cursor: pointer;
        background-color: #2C2C2C;
        border: none;
        color: #fff;
        border-radius: 4px;
      }
      .btn-link {
        display: block;
        text-align: center;
        margin-top: 10px;
        color: #2C2C2C;
        text-decoration: none;
      }

      p {
        text-align: center;
      }
    </style>
</head>
<body>

    <div class="card card-aeterna-admin">
        <h1 class="titulo-marca mb-1">AETERNA</h1>
        <div class="card-body">
            <h2 class="subtitulo-marca mb-4">Área Administrativa</h2>
            <form id="login-form">
                <input type="text" id="usuario" name="usuario" class="form-control mb-3" placeholder="Usuário" required>
                <input type="password" id="senha" name="senha" class="form-control mb-3" placeholder="Senha" required>
                <button type="submit" class="btn-btn-primary">Entrar</button>
                <a href="RedefinirSenha.html" class="btn-link">Esqueci minha senha</a>
                <p class="mt-3 small">É um novo administrador? <a href="PaginaCadastro.html">Cadastre-se</a></p>
            </form>
    </div>
    
</body>
</html>
