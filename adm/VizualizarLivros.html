<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizualizar Livros</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="VizualizarLivros.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">AETERNA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#">Principal</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Livros</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Pedidos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Usuários</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Conta
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Meus dados</a></li>
                <li><a class="dropdown-item" href="#">Sair</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="card card-aeterna-admin card-livros p-4 p-sm-5 mx-auto mb-4">
        <div class="card-body">
          <h1 class="titulo-marca mb-1 text-center">AETERNA</h1>
          <p class="subtitulo-marca mb-4 text-center">Gerenciar Livros</p>

          <form id="form-livro" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <input type="text" id="titulo-livro" class="form-control" placeholder="Título do Livro" required />
              </div>
              <div class="col-md-6">
                <input type="text" id="autor-livro" class="form-control" placeholder="Autor do Livro" required />
              </div>
              <div class="col-md-6">
                <input type="text" id="editora-livro" class="form-control" placeholder="Editora" />
              </div>
              <div class="col-md-6">
                <input type="text" id="categoria-livro" class="form-control" placeholder="Categoria" />
              </div>
              <div class="col-md-6">
                <input type="number" id="preco-livro" class="form-control" placeholder="Preço (R$)" step="0.01" min="0" required />
              </div>
              <div class="col-md-6">
                <input type="date" id="publicacao-livro" class="form-control" placeholder="Data de Publicação" />
              </div>
              <div class="col-12">
                <textarea id="descricao-livro" class="form-control" placeholder="Descrição" rows="3"></textarea>
              </div>
              <div class="col-12 text-start">
                <label for="capa-livro" class="form-label small mb-1">Capa do Livro</label>
                <input type="file" id="capa-livro" class="form-control" accept="image/*" />
              </div>
              <div class="col-12 text-start">
                <label for="conteudo-livro" class="form-label small mb-1">Conteúdo do Livro (PDF ou EPUB)</label>
                <input type="file" id="conteudo-livro" class="form-control" accept=".pdf,.epub" />
              </div>
            </div>

            <p id="msg-form" class="msg-erro mt-3 mb-0" style="display:none;"></p>

            <button
              type="button"
              id="btn-submit"
              class="btn btn-primary w-100 mt-3"
              onclick="inserirLivro()"
            >
              CADASTRAR LIVRO
            </button>
          </form>
        </div>
      </div>

      <div class="card card-aeterna-admin card-livros p-4 p-sm-5 mx-auto">
        <div class="card-body">
          <p class="subtitulo-marca mb-4 text-center">Livros Registrados</p>

          <div id="lista-carregando" class="text-center py-4">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Carregando...</span>
            </div>
          </div>

          <div id="lista-vazia" class="text-center text-muted py-4" style="display:none;">
            Nenhum livro cadastrado ainda.
          </div>

          <div id="grid-livros" class="d-flex flex-column gap-3" style="display:none;"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // TODO: preencher com as credenciais do seu projeto Supabase
      const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
      const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_PUBLICA";
      const BUCKET_CAPAS = "capas-livros";
      const BUCKET_CONTEUDO = "conteudo-livros";
      const TABELA_LIVROS = "livros";

      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const msgForm = document.getElementById("msg-form");
      const btnSubmit = document.getElementById("btn-submit");
      const listaCarregando = document.getElementById("lista-carregando");
      const listaVazia = document.getElementById("lista-vazia");
      const gridLivros = document.getElementById("grid-livros");

      function formatarData(data) {
        if (!data) return "Não informada";
        const [ano, mes, dia] = data.split("-");
        return `${dia}/${mes}/${ano}`;
      }

      function formatarPreco(valor) {
        return Number(valor).toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL",
        });
      }

      function mostrarErro(texto) {
        msgForm.textContent = texto;
        msgForm.style.display = "block";
      }

      function limparErro() {
        msgForm.style.display = "none";
      }

      async function carregarLivros() {
        listaCarregando.style.display = "block";
        listaVazia.style.display = "none";
        gridLivros.style.display = "none";

        const { data, error } = await supabaseClient
          .from(TABELA_LIVROS)
          .select("*")
          .order("titulo", { ascending: true });

        listaCarregando.style.display = "none";

        if (error) {
          listaVazia.textContent = "Erro ao carregar livros: " + error.message;
          listaVazia.style.display = "block";
          return;
        }

        if (!data || data.length === 0) {
          listaVazia.style.display = "block";
          return;
        }

        gridLivros.innerHTML = "";
        data.forEach((livro) => {
          const item = document.createElement("div");
          item.className = "livro-item d-flex gap-3 p-3";
          item.innerHTML = `
            ${
              livro.capa_url
                ? `<img src="${livro.capa_url}" alt="Capa de ${livro.titulo}" class="capa-thumb-lg flex-shrink-0" />`
                : `<div class="capa-thumb-lg capa-thumb-vazia flex-shrink-0"></div>`
            }
            <div class="flex-grow-1 text-start">
              <div class="d-flex justify-content-between align-items-start">
                <h5 class="livro-titulo mb-0">${livro.titulo ?? ""}</h5>
                <button class="btn btn-sm btn-outline-danger" onclick="excluirLivro('${livro.id}')">
                  Excluir
                </button>
              </div>
              <p class="livro-autor mb-2">${livro.autor ?? ""}</p>
              <div class="livro-meta mb-2">
                <span><strong>Categoria:</strong> ${livro.categoria ?? "Não informada"}</span>
                <span><strong>Editora:</strong> ${livro.editora ?? "Não informada"}</span>
                <span><strong>Publicação:</strong> ${formatarData(livro.data_publicacao)}</span>
                <span><strong>Preço:</strong> ${livro.preco != null ? formatarPreco(livro.preco) : "Não informado"}</span>
              </div>
              ${
                livro.descricao
                  ? `<p class="livro-descricao mb-0">${livro.descricao}</p>`
                  : ""
              }
              ${
                livro.conteudo_url
                  ? `<a href="${livro.conteudo_url}" target="_blank" class="livro-conteudo-link">Ler conteúdo do livro</a>`
                  : `<span class="livro-conteudo-vazio">Conteúdo ainda não cadastrado</span>`
              }
            </div>
          `;
          gridLivros.appendChild(item);
        });

        gridLivros.style.display = "flex";
      }

      async function uploadArquivo(bucket, arquivo) {
        const nomeArquivo = `${Date.now()}-${arquivo.name}`;
        const { error: erroUpload } = await supabaseClient.storage
          .from(bucket)
          .upload(nomeArquivo, arquivo);

        if (erroUpload) {
          throw new Error("Erro ao enviar arquivo: " + erroUpload.message);
        }

        const { data } = supabaseClient.storage.from(bucket).getPublicUrl(nomeArquivo);
        return data.publicUrl;
      }

      async function inserirLivro() {
        limparErro();

        const titulo = document.getElementById("titulo-livro").value.trim();
        const autor = document.getElementById("autor-livro").value.trim();
        const editora = document.getElementById("editora-livro").value.trim();
        const categoria = document.getElementById("categoria-livro").value.trim();
        const preco = document.getElementById("preco-livro").value;
        const publicacao = document.getElementById("publicacao-livro").value;
        const descricao = document.getElementById("descricao-livro").value.trim();
        const arquivoCapa = document.getElementById("capa-livro").files[0];
        const arquivoConteudo = document.getElementById("conteudo-livro").files[0];

        if (!titulo || !autor || !preco) {
          mostrarErro("Preencha ao menos título, autor e preço.");
          return;
        }

        btnSubmit.disabled = true;
        btnSubmit.textContent = "CADASTRANDO...";

        try {
          let capaUrl = null;
          if (arquivoCapa) {
            capaUrl = await uploadArquivo(BUCKET_CAPAS, arquivoCapa);
          }

          let conteudoUrl = null;
          if (arquivoConteudo) {
            conteudoUrl = await uploadArquivo(BUCKET_CONTEUDO, arquivoConteudo);
          }

          const { error } = await supabaseClient.from(TABELA_LIVROS).insert({
            titulo,
            autor,
            editora: editora || null,
            categoria: categoria || null,
            preco: Number(preco),
            data_publicacao: publicacao || null,
            descricao: descricao || null,
            capa_url: capaUrl,
            conteudo_url: conteudoUrl,
          });

          if (error) {
            mostrarErro("Erro ao cadastrar livro: " + error.message);
            return;
          }

          document.getElementById("form-livro").reset();
          await carregarLivros();
        } catch (err) {
          mostrarErro(err.message);
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.textContent = "CADASTRAR LIVRO";
        }
      }

      async function excluirLivro(id) {
        const confirmar = confirm("Tem certeza que deseja excluir este livro?");
        if (!confirmar) return;

        const { error } = await supabaseClient
          .from(TABELA_LIVROS)
          .delete()
          .eq("id", id);

        if (error) {
          alert("Erro ao excluir livro: " + error.message);
          return;
        }

        await carregarLivros();
      }

      carregarLivros();
    </script>
</body>
</html>
