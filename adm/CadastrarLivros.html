<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar de Livros</title>
      <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
     <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <div class="card card-aeterna-admin p-4 p-sm-5 text-center">
      <div class="card-body">
        <h1 class="titulo-marca mb-1">AETERNA</h1>
        <p class="subtitulo-marca mb-4">Cadastrar Livros</p>

        <div id="tela-formulario">
          <input
            type="text"
            id="titulo-livro"
            class="form-control mb-3"
            placeholder="Título do Livro"
          />
          <input
            type="text"
            id="autor-livro"
            class="form-control mb-3"
            placeholder="Autor do Livro"
          />
          <input
            type="text"
            id="genero-livro"
            class="form-control mb-3"
            placeholder="Gênero do Livro"
          />
          <button
            id="btn-submit"
            class="btn btn-primary"
            onclick="cadastrarLivro()"
          >
            CADASTRAR LIVRO
          </button>
        </div>
      </div>

</head>

</body>
