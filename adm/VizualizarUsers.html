<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeterna - Visualizar Usuários</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="VizualizarUsuarios.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">AETERNA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="#">Principal</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Livros</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Pedidos</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Usuários</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                Conta
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Meus dados</a></li>
                <li><a class="dropdown-item" href="#">Sair</a></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <div class="card card-aeterna-admin card-usuarios p-4 p-sm-5 mx-auto">
        <div class="card-body">
          <h1 class="titulo-marca mb-1 text-center">AETERNA</h1>
          <p class="subtitulo-marca mb-4 text-center">Usuários</p>

          <div class="row g-2 mb-4">
            <div class="col-md-5">
              <input type="text" id="nome-usuario" class="form-control" placeholder="Buscar por nome" />
            </div>
            <div class="col-md-5">
              <input type="text" id="email-usuario" class="form-control" placeholder="Buscar por email" />
            </div>
            <div class="col-md-2">
              <button
                id="btn-submit"
                class="btn btn-primary w-100"
                onclick="filtrarUsuarios()"
              >
                BUSCAR
              </button>
            </div>
          </div>

          <div id="lista-carregando" class="text-center py-4">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Carregando...</span>
            </div>
          </div>

          <div id="lista-vazia" class="text-center text-muted py-4" style="display:none;">
            Nenhum usuário encontrado.
          </div>

          <div id="grid-usuarios" class="d-flex flex-column gap-2" style="display:none;"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"
      integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"
      integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // TODO: preencher com as credenciais do seu projeto Supabase
      const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
      const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_PUBLICA";
      const TABELA_PERFIS = "perfils";

      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const listaCarregando = document.getElementById("lista-carregando");
      const listaVazia = document.getElementById("lista-vazia");
      const gridUsuarios = document.getElementById("grid-usuarios");

      let todosUsuarios = [];

      function formatarData(data) {
        if (!data) return "Não informada";
        const d = new Date(data);
        return d.toLocaleDateString("pt-BR");
      }

      async function carregarUsuarios() {
        listaCarregando.style.display = "block";
        listaVazia.style.display = "none";
        gridUsuarios.style.display = "none";

        const { data, error } = await supabaseClient
          .from(TABELA_PERFIS)
          .select("*")
          .order("nome", { ascending: true });

        listaCarregando.style.display = "none";

        if (error) {
          listaVazia.textContent = "Erro ao carregar usuários: " + error.message;
          listaVazia.style.display = "block";
          return;
        }

        todosUsuarios = data || [];
        renderizarUsuarios(todosUsuarios);
      }

      function renderizarUsuarios(lista) {
        if (lista.length === 0) {
          gridUsuarios.style.display = "none";
          listaVazia.style.display = "block";
          return;
        }

        listaVazia.style.display = "none";
        gridUsuarios.innerHTML = "";

        lista.forEach((usuario) => {
          const item = document.createElement("div");
          item.className = "usuario-item d-flex justify-content-between align-items-center p-3";
          item.innerHTML = `
            <div class="text-start">
              <p class="usuario-nome mb-0">${usuario.nome || "Sem nome cadastrado"}</p>
              <p class="usuario-email mb-0">${usuario.email || ""}</p>
              <p class="usuario-data mb-0">Cadastrado em ${formatarData(usuario.criado_em)}</p>
            </div>
            <button class="btn btn-sm btn-outline-danger" onclick="excluirUsuario('${usuario.id}')">
              Excluir
            </button>
          `;
          gridUsuarios.appendChild(item);
        });

        gridUsuarios.style.display = "flex";
      }

      function filtrarUsuarios() {
        const nome = document.getElementById("nome-usuario").value.trim().toLowerCase();
        const email = document.getElementById("email-usuario").value.trim().toLowerCase();

        const filtrados = todosUsuarios.filter((u) => {
          const nomeOk = !nome || (u.nome || "").toLowerCase().includes(nome);
          const emailOk = !email || (u.email || "").toLowerCase().includes(email);
          return nomeOk && emailOk;
        });

        renderizarUsuarios(filtrados);
      }

      async function excluirUsuario(id) {
        const confirmar = confirm(
          "Isso remove o perfil do usuário, mas não a conta de login (auth.users). Continuar?"
        );
        if (!confirmar) return;

        const { error } = await supabaseClient
          .from(TABELA_PERFIS)
          .delete()
          .eq("id", id);

        if (error) {
          alert("Erro ao excluir usuário: " + error.message);
          return;
        }

        await carregarUsuarios();
      }

      carregarUsuarios();
    </script>
</body>
</html>
