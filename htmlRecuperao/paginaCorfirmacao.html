<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeterna - Confirmar Email</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="RedefinirSenha.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="card card-aeterna p-4 p-sm-5 text-center">
      <div class="card-body">
        <h1 class="titulo-marca mb-1">AETERNA</h1>
        <p class="subtitulo-marca mb-4">Confirmação de Email</p>
        <div id="mensagem" class="small mb-3">Confirmando sua conta...</div>
        <a
          id="btn-abrir-app"
          href="aeterna://login"
          class="btn btn-primary w-100"
          style="display:none;"
        >
          ABRIR O APP
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      // TODO: preencher com as credenciais do seu projeto Supabase
      const SUPABASE_URL = "https://SEU_PROJETO.supabase.co";
      const SUPABASE_ANON_KEY = "SUA_CHAVE_ANON_PUBLICA";

      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const elMensagem = document.getElementById("mensagem");

      async function confirmarEmail() {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get("access_token");
        const refreshToken = hashParams.get("refresh_token");
        const type = hashParams.get("type");

        if (!accessToken || type !== "signup") {
          elMensagem.textContent =
            "Este link é inválido ou expirou. Tente se cadastrar novamente pelo app.";
          elMensagem.className = "small msg-erro";
          return;
        }

        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });

        if (error) {
          elMensagem.textContent =
            "Não foi possível confirmar seu email. Tente novamente pelo app.";
          elMensagem.className = "small msg-erro";
          return;
        }

        elMensagem.textContent =
          "Email confirmado com sucesso! Você já pode voltar ao app e fazer login.";
        elMensagem.className = "small msg-sucesso mb-3";
        document.getElementById("btn-abrir-app").style.display = "block";
      }

      confirmarEmail();
    </script>
  </body>
</html>
